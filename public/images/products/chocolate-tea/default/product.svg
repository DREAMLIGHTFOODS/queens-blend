<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Product preview</title>
  <desc id="desc">Stylized tea product pack arranged in a premium presentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c242f" />
      <stop offset="50%" stop-color="#33465f" />
      <stop offset="100%" stop-color="#6b8aa8" />
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e7d4" />
      <stop offset="100%" stop-color="#dccfb4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="430" y="180" width="340" height="510" rx="24" fill="url(#pack)" filter="url(#shadow)" />
  <rect x="462" y="230" width="276" height="136" rx="14" fill="#fff7e9" />
  <rect x="462" y="398" width="276" height="220" rx="14" fill="#e8dbc0" />
  <circle cx="600" cy="492" r="62" fill="#9f7849" />
  <path d="M560 550h80l-16 40h-48z" fill="#b48a56" />
  <text x="514" y="318" font-size="34" font-family="Georgia, serif" fill="#5a462f" letter-spacing="2">TEA</text>
  <text x="518" y="356" font-size="22" font-family="Georgia, serif" fill="#7f6846" letter-spacing="3">PRODUCT</text>
  <text x="76" y="118" font-size="44" font-family="Georgia, serif" fill="#eaf1f8" letter-spacing="3">PACKAGED</text>
</svg>
