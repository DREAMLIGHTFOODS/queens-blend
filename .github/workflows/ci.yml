name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Lint, Typecheck, Build, Perf Compare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run perf compare
        run: npm run perf:compare

      - name: Upload perf snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-snapshot-report
          path: |
            docs/reports/perf-snapshot.json
            docs/reports/perf-baseline.json
          if-no-files-found: warn
